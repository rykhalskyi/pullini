# Pullini — self-contained Docker Compose installation (HLD §3A).
#
# SQLite (default):        docker compose up --build
# PostgreSQL (optional):   set DATABASE_URL in .env and run
#                          docker compose --profile postgres up --build
services:
  web:
    build: .
    image: pullini:latest
    ports:
      - "${PULLINI_PORT:-8000}:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY (>=32 random characters) in .env}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_SECURE_COOKIES: ${DJANGO_SECURE_COOKIES:-false}
      DATA_DIR: /data
      DATABASE_URL: ${DATABASE_URL:-}
    volumes:
      - pullini-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:8000/healthz").status == 200 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  scheduler:
    image: pullini:latest
    depends_on:
      - web
    command: ["/app/docker/scheduler.sh"]
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY (>=32 random characters) in .env}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DATA_DIR: /data
      DATABASE_URL: ${DATABASE_URL:-}
      PULLINI_SKIP_BOOTSTRAP: "true"
      SYNC_POLL_SECONDS: ${SYNC_POLL_SECONDS:-60}
    volumes:
      - pullini-data:/data
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: pullini
      POSTGRES_USER: pullini
      POSTGRES_PASSWORD: pullini
    volumes:
      - pullini-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pullini -d pullini"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pullini-data:
  pullini-postgres:
