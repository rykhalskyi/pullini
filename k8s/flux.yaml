# FluxCD wiring (HLD §3B). Apply once to a cluster that runs Flux; afterwards
# every push to the tracked branch reconciles the manifests in ./k8s.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: pullini
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/rykhalskyi/pullini
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pullini
  namespace: flux-system
spec:
  interval: 10m
  targetNamespace: pullini
  prune: true
  sourceRef:
    kind: GitRepository
    name: pullini
  path: ./k8s
