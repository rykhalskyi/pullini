# Template only — do not commit real secrets. In a FluxCD setup, supply these
# through a SealedSecret (Bitnami) or SOPS-encrypted manifest instead.
apiVersion: v1
kind: Secret
metadata:
  name: pullini-secrets
  namespace: pullini
type: Opaque
stringData:
  DJANGO_SECRET_KEY: "replace-with-a-long-random-value"
  # PostgreSQL is a cluster service; point Pullini at it here (HLD §3B).
  DATABASE_URL: "postgres://pullini:change-me@postgres.postgres.svc.cluster.local:5432/pullini"
