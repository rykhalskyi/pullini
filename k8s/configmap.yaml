apiVersion: v1
kind: ConfigMap
metadata:
  name: pullini-config
  namespace: pullini
data:
  DJANGO_DEBUG: "false"
  DJANGO_ALLOWED_HOSTS: "pullini.example.com"
  DJANGO_CSRF_TRUSTED_ORIGINS: "https://pullini.example.com"
  DJANGO_SECURE_COOKIES: "true"
  # TLS terminates at an ingress/load balancer that sets X-Forwarded-Proto.
  DJANGO_TRUST_PROXY_HEADERS: "true"
  DJANGO_SECURE_SSL_REDIRECT: "true"
  DJANGO_SECURE_HSTS_SECONDS: "31536000"
  DJANGO_LOG_LEVEL: "INFO"
  DATA_DIR: "/data"
