apiVersion: apps/v1
kind: Deployment
metadata:
  name: pullini
  namespace: pullini
  labels:
    app.kubernetes.io/name: pullini
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pullini
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pullini
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: web
          image: ghcr.io/rykhalskyi/pullini:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: pullini-config
            - secretRef:
                name: pullini-secrets
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
        # Scheduler runs as a sidecar so it shares the ReadWriteOnce data volume
        # with the web container (a separate CronJob could not mount it).
        - name: scheduler
          image: ghcr.io/rykhalskyi/pullini:latest
          imagePullPolicy: IfNotPresent
          command: ["/app/docker/scheduler.sh"]
          env:
            - name: PULLINI_SKIP_BOOTSTRAP
              value: "true"
          envFrom:
            - configMapRef:
                name: pullini-config
            - secretRef:
                name: pullini-secrets
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pullini-data
