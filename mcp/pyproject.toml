[project]
name = "pullini-mcp"
version = "0.10.0"
description = "Local stdio MCP connector for Pullini artifacts (E6, T6)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Iaroslav Rykhalskyi", email = "rikhalskiy@gmail.com" }
]
keywords = ["mcp", "pullini", "artifacts", "agents", "fastmcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "httpx>=0.27",
    "mcp>=2",
]

[project.urls]
Homepage = "https://github.com/rykhalskyi/pullini"
Repository = "https://github.com/rykhalskyi/pullini"
Issues = "https://github.com/rykhalskyi/pullini/issues"

[project.scripts]
pullini-mcp = "pullini_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pullini_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
