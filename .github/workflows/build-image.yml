name: Build image

# Manual, on-demand image build. Run it from Actions -> "Build image" ->
# "Run workflow" (optionally on a branch/tag and with an extra tag). Nothing is
# built automatically on push, so deploys stay deliberate.
#
# Pushes ghcr.io/<repo>:sha-<commit> (and :latest, plus an optional extra tag),
# stamps the commit into the image (PULLINI_GIT_SHA, shown at /healthz), and
# prints the digest to pin in the homelab repo.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional extra tag to push (e.g. 0.1.0). sha-<commit> and latest are always pushed."
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image
  cancel-in-progress: false

jobs:
  image:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compose tags
        id: tags
        env:
          EXTRA_TAG: ${{ github.event.inputs.tag }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          {
            echo "tags<<EOF"
            echo "${IMAGE}:sha-${GITHUB_SHA}"
            echo "${IMAGE}:latest"
            if [ -n "${EXTRA_TAG:-}" ]; then
              echo "${IMAGE}:${EXTRA_TAG}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            PULLINI_GIT_SHA=${{ github.sha }}
          tags: ${{ steps.tags.outputs.tags }}

      - name: Show what was built
        run: |
          echo "Version: $(grep -oP '^version = \"\K[^\"]+' pyproject.toml)"
          echo "Commit:  ${{ github.sha }}"
          echo "Digest:  ${{ steps.build.outputs.digest }}"
          echo "Pin this digest in the homelab repo (update-pullini-image-pin.yml)."

      # Optional: tell the homelab repo to open an image-pin PR immediately.
      # Needs a HOMELAB_DISPATCH_TOKEN Actions secret (PAT with Actions:write on
      # rykhalskyi/homelab). Without it, the homelab pin workflow still picks up
      # the new image on its schedule.
      - name: Notify homelab to pin the image
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.HOMELAB_DISPATCH_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "HOMELAB_DISPATCH_TOKEN not set; skipping pin notification."
            exit 0
          fi
          gh api "repos/rykhalskyi/homelab/dispatches" \
            --method POST \
            -f event_type=pullini-image \
            -f client_payload[sha]="${{ github.sha }}"
