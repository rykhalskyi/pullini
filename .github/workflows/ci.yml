name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.15"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pullini
          POSTGRES_USER: pullini
          POSTGRES_PASSWORD: pullini
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pullini"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production-0123456789
      DJANGO_DEBUG: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.15"
          enable-cache: true
      - run: uv sync --frozen
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build:css
      - if: matrix.database == 'postgres'
        run: echo "DATABASE_URL=postgres://pullini:pullini@localhost:5432/pullini" >> "$GITHUB_ENV"
      - run: uv run python manage.py collectstatic --noinput
      - run: uv run coverage run -m pytest
      - run: uv run coverage report

  image:
    name: Build and push image
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest

      - name: Show the digest to pin
        run: |
          echo "Pin this digest: ${{ steps.build.outputs.digest }}"

      # Optional: tell the homelab repo to open an image-pin PR immediately.
      # Needs a HOMELAB_DISPATCH_TOKEN Actions secret (PAT with Actions:write on
      # rykhalskyi/homelab). Without it, the homelab pin workflow still picks up
      # the new image on its schedule.
      - name: Notify homelab to pin the image
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.HOMELAB_DISPATCH_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "HOMELAB_DISPATCH_TOKEN not set; skipping pin notification."
            exit 0
          fi
          gh api "repos/rykhalskyi/homelab/dispatches" \
            --method POST \
            -f event_type=pullini-image \
            -f client_payload[sha]="${{ github.sha }}"
