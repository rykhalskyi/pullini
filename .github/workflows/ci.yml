name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.15"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pullini
          POSTGRES_USER: pullini
          POSTGRES_PASSWORD: pullini
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pullini"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production-0123456789
      DJANGO_DEBUG: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.15"
          enable-cache: true
      - run: uv sync --frozen
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build:css
      - if: matrix.database == 'postgres'
        run: echo "DATABASE_URL=postgres://pullini:pullini@localhost:5432/pullini" >> "$GITHUB_ENV"
      - run: uv run python manage.py collectstatic --noinput
      - run: uv run coverage run -m pytest
      - run: uv run coverage report
