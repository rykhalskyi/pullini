[project]
name = "pullini"
version = "0.3.0"
description = "A read-only Git-backed wiki browser."
readme = "README.md"
authors = [
    { name = "Iaroslav Rykhalskyi", email = "rikhalskiy@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "django>=6.1",
    "django-environ>=0.14.0",
    "gunicorn>=26.2.0",
    "markdown>=3.7",
    "nh3>=0.2",
    "psycopg[binary]>=3.2",
    "whitenoise>=6.12.0",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    "django-debug-toolbar>=8.0.0",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "C4", "SIM"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "pullini.settings"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/pullini"]
omit = ["*/migrations/*"]
