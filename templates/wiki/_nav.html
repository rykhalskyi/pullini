<nav class="text-sm text-ink/70" aria-label="Breadcrumb">
  <a href="{% url 'projects:list' %}" class="hover:text-brand">Projects</a>
  <span class="px-1">/</span>
  <a href="{{ project.get_absolute_url }}" class="text-navy hover:text-brand">{{ project.name }}</a>
  <span class="px-1">/</span>
  <span class="text-navy">Wiki</span>
</nav>

<div class="mt-4 flex flex-wrap items-center justify-between gap-4">
  <div>
    <h1 class="text-3xl font-bold tracking-tight text-navy">Wiki</h1>
    <p class="mt-1 text-sm text-ink/70">
      {{ project.pages.count }} page{{ project.pages.count|pluralize }} from
      <span class="font-mono">{{ project.docs_folder }}/</span>
    </p>
  </div>
  <div class="flex items-center gap-1 rounded-lg border border-line p-1 text-sm">
    <a
      href="{% url 'wiki:tree' project.slug %}"
      class="rounded-md px-3 py-1 transition-colors {% if active == 'tree' %}bg-brand/10 font-medium text-brand{% else %}text-navy hover:bg-soft{% endif %}"
      >Tree</a
    >
    <a
      href="{% url 'wiki:index' project.slug %}"
      class="rounded-md px-3 py-1 transition-colors {% if active == 'index' %}bg-brand/10 font-medium text-brand{% else %}text-navy hover:bg-soft{% endif %}"
      >Index</a
    >
    <a
      href="{% url 'wiki:recent' project.slug %}"
      class="rounded-md px-3 py-1 transition-colors {% if active == 'recent' %}bg-brand/10 font-medium text-brand{% else %}text-navy hover:bg-soft{% endif %}"
      >Recent</a
    >
  </div>
</div>
