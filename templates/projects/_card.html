<article class="rounded-xl border border-line bg-white p-5 transition-colors hover:border-brand/40">
  <div class="flex items-start justify-between gap-3">
    <h3 class="text-base font-semibold text-navy">
      <a href="{{ project.get_absolute_url }}" class="hover:text-brand">{{ project.name }}</a>
    </h3>
    {% if not project.enabled %}
    <span class="rounded-full bg-soft px-2 py-0.5 text-xs font-medium text-ink/70">Disabled</span>
    {% endif %}
  </div>
  {% if project.description %}
  <p class="mt-2 line-clamp-2 text-sm text-ink">{{ project.description }}</p>
  {% endif %}
  <dl class="mt-4 flex flex-wrap gap-x-4 gap-y-1 text-xs text-ink/70">
    <div class="flex min-w-0 items-center gap-1">
      <span aria-hidden="true" class="text-git">&#9679;</span>
      <span class="truncate font-mono">{{ project.repo_url }}</span>
    </div>
    <div>branch <span class="font-medium text-navy">{{ project.branch }}</span></div>
    <div>{{ project.docs_folder }}/</div>
    <div>sync {{ project.update_interval_display }}</div>
  </dl>
</article>
