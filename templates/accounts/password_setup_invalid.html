{% extends "base.html" %}
{% block title %}Invalid link · Pullini{% endblock %}
{% block content %}
<div class="mx-auto w-full max-w-sm">
  <h1 class="text-2xl font-bold tracking-tight text-navy">This link is invalid</h1>
  <p class="mt-2 text-sm text-ink/70">
    The password setup link is invalid, has expired, or has already been used. Ask an
    administrator to generate a new one.
  </p>
  <a
    href="{% url 'login' %}"
    class="mt-6 inline-block rounded-md bg-brand px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-brand/90"
    >Back to log in</a
  >
</div>
{% endblock %}
